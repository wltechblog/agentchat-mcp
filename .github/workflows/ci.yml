name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...
